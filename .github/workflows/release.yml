name: Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4

      - name: Checkout OpenCut Classic
        uses: actions/checkout@v4
        with:
          repository: opencut-app/opencut-classic
          path: opencut-classic

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install editor dependencies
        working-directory: opencut-classic
        run: bun install

      - name: Use one Next.js install
        working-directory: opencut-classic
        shell: pwsh
        run: |
          $appNext = Join-Path (Get-Location) "apps\web\node_modules\next"
          $rootNext = Join-Path (Get-Location) "node_modules\next"
          if ((Test-Path $appNext) -and (Test-Path $rootNext)) {
            Remove-Item -Recurse -Force $appNext
            New-Item -ItemType Junction -Path $appNext -Target $rootNext | Out-Null
          }

      - name: Remove online-only editor pieces
        shell: pwsh
        run: ./scripts/strip-online.ps1 -ClassicRoot opencut-classic

      - name: Skip upstream type errors
        working-directory: opencut-classic
        shell: pwsh
        run: |
          $path = "apps\web\next.config.ts"
          $content = Get-Content $path -Raw
          $insertion = "const nextConfig: NextConfig = {`n  typescript: { ignoreBuildErrors: true },"
          $patched = $content.Replace("const nextConfig: NextConfig = {", $insertion)
          if ($patched -eq $content) { throw "Could not patch next.config.ts" }
          Set-Content -Path $path -Value $patched -NoNewline

      - name: Build the editor
        working-directory: opencut-classic/apps/web
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          DATABASE_URL: postgresql://opencut:opencut@127.0.0.1:5432/opencut
          BETTER_AUTH_SECRET: build-time-secret
          UPSTASH_REDIS_REST_URL: http://127.0.0.1:8079
          UPSTASH_REDIS_REST_TOKEN: example_token
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4173
          NEXT_PUBLIC_MARBLE_API_URL: https://api.marblecms.com
          MARBLE_WORKSPACE_KEY: build-placeholder
          FREESOUND_CLIENT_ID: build-placeholder
          FREESOUND_API_KEY: build-placeholder
        run: bun run build

      - name: Package opencut-classic.exe
        shell: pwsh
        run: ./scripts/package.ps1 -ClassicRoot opencut-classic -OutDir dist/opencut-classic

      - name: Zip the app
        shell: pwsh
        run: Compress-Archive -Path dist/opencut-classic/* -DestinationPath dist/opencut-classic-windows.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          gh release create "v$version" dist/opencut-classic-windows.zip --repo "${{ github.repository }}" --title "opencut-classic.exe $version" --notes-file RELEASE_NOTES.md
